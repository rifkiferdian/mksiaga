{{define "content"}}
<div class="relative grid min-h-screen overflow-hidden bg-slate-950 px-4 py-10 sm:px-6">
  <div class="pointer-events-none absolute inset-0"><div class="absolute -left-32 -top-32 size-96 rounded-full bg-orange-500/20 blur-3xl"></div><div class="absolute -bottom-40 -right-32 size-[30rem] rounded-full bg-amber-400/10 blur-3xl"></div><div class="absolute inset-0 opacity-[.04] [background-image:linear-gradient(white_1px,transparent_1px),linear-gradient(90deg,white_1px,transparent_1px)] [background-size:42px_42px]"></div></div>
  <main class="relative m-auto w-full max-w-2xl text-center">
    <a href="/" class="mx-auto mb-8 inline-flex items-center gap-3 text-white"><span class="grid size-11 place-items-center rounded-2xl bg-orange-500 shadow-lg shadow-orange-500/25"><i class="fa-solid fa-shield-halved text-xl" aria-hidden="true"></i></span><span class="text-left"><strong class="block text-sm tracking-wide">{{.AppName}}</strong><small class="text-[10px] text-slate-400">Portal administrasi</small></span></a>
    <section class="rounded-[2rem] border border-white/10 bg-white/[.07] p-6 shadow-2xl shadow-black/30 backdrop-blur-xl sm:p-10">
      <div class="relative mx-auto grid size-24 place-items-center rounded-3xl bg-gradient-to-br from-orange-400 to-orange-600 text-white shadow-xl shadow-orange-950/30"><i class="fa-solid {{.Error.Icon}} text-4xl" aria-hidden="true"></i><span class="absolute -right-3 -top-3 rounded-full border-4 border-slate-900 bg-white px-2.5 py-1 text-xs font-black text-orange-600">{{.Error.Code}}</span></div>
      <p class="mt-7 text-[11px] font-bold uppercase tracking-[.22em] text-orange-400">{{.Error.Eyebrow}}</p>
      <h1 class="mt-3 text-2xl font-bold tracking-tight text-white sm:text-4xl">{{.Error.Title}}</h1>
      <p class="mx-auto mt-4 max-w-lg text-sm leading-7 text-slate-300">{{.Error.Description}}</p>
      <div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row"><a href="{{.Error.ActionURL}}" class="inline-flex items-center justify-center gap-2 rounded-xl bg-orange-500 px-5 py-3 text-sm font-bold text-white shadow-lg shadow-orange-950/30 transition hover:bg-orange-400"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i>{{.Error.ActionLabel}}</a>{{if .Error.SecondaryURL}}<a href="{{.Error.SecondaryURL}}" class="inline-flex items-center justify-center rounded-xl border border-white/15 bg-white/5 px-5 py-3 text-sm font-bold text-slate-200 transition hover:bg-white/10">{{.Error.SecondaryLabel}}</a>{{end}}</div>
    </section>
    <p class="mt-6 text-[11px] text-slate-500">Jika masalah berlanjut, hubungi Divisi Software Development Manna Kampus.</p>
  </main>
</div>
{{end}}
