root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/mksiaga ./cmd/web"
entrypoint = ["./tmp/mksiaga"]
include_ext = ["go", "html", "tpl", "tmpl"]
include_file = [".env", "go.mod", "go.sum"]
exclude_dir = ["tmp", "bin", "node_modules", "storage", ".git", "web/static", 'web\static']
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
delay = 500
stop_on_error = true
send_interrupt = false
kill_delay = "500ms"
log = "build-errors.log"

[build.windows]
cmd = "go build -o ./tmp/mksiaga.exe ./cmd/web"
entrypoint = ["tmp\\mksiaga.exe"]

[log]
time = true

[misc]
clean_on_exit = false

[screen]
clear_on_rebuild = false
keep_scroll = true

[proxy]
enabled = false
